<style>
/* Layout: a flow picker on top, then one device frame (desktop or phone) running the sign-up, verify, card, setup and sign-in screens in the website's dark aurora style. */
:root{--bg:#07090D;--s1:#10151D;--s2:#171E29;--bd:#212B38;--tx:#EEF2F6;--mu:#8D9AA9;--ac:#C8F25C;--acfg:#0A0E13;--at:#C8F25C;--acsoft:rgba(200,242,92,.12);--warn:#FFB020;--rd:#FF7A6B;--blue:#5AA9FF;--violet:#A78BFA;--teal:#2DD4BF;--glow:rgba(200,242,92,.22);--a1:rgba(200,242,92,.28);--a2:rgba(45,212,191,.20);--a3:rgba(167,139,250,.20);color-scheme:dark;--fd:'Space Grotesk',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--fd);font-size:16px;line-height:1.5;margin:0;padding:18px 16px 60px}

.pick{max-width:1180px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.pick button{border:1px solid var(--bd);background:var(--s1);color:var(--mu);font:inherit;font-size:13.5px;font-weight:500;border-radius:99px;padding:8px 14px;cursor:pointer;min-height:38px}
.pick button[aria-pressed="true"]{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
.pick button:focus-visible{outline:2px solid var(--at);outline-offset:2px}
.dev{display:flex;gap:4px;border:1px solid var(--bd);border-radius:99px;padding:3px;background:var(--s1)}
.dev button{border:0;background:none;padding:6px 14px;min-height:34px}
.frame{margin:0 auto;max-width:1180px;transition:max-width .5s cubic-bezier(.2,.7,.2,1)}
.frame[data-d="m"]{max-width:402px}
.stage{container-type:inline-size;position:relative;border:1px solid var(--bd);border-radius:30px;overflow:hidden;background:var(--bg);min-height:760px}
.frame[data-d="m"] .stage{border-radius:44px;min-height:780px}
.aur{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aur i{position:absolute;border-radius:50%;filter:blur(90px)}
.aur i:nth-child(1){width:460px;height:460px;left:-6%;top:-120px;background:var(--a1);animation:f1 16s ease-in-out infinite}
.aur i:nth-child(2){width:420px;height:420px;right:-4%;top:30%;background:var(--a2);animation:f2 19s ease-in-out infinite}
.aur i:nth-child(3){width:380px;height:380px;left:30%;bottom:-160px;background:var(--a3);animation:f3 22s ease-in-out infinite}
@keyframes f1{50%{transform:translate(100px,60px) scale(1.15)}}@keyframes f2{50%{transform:translate(-110px,40px) scale(.9)}}@keyframes f3{50%{transform:translate(-80px,-60px) scale(1.2)}}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);min-height:760px}
@container (max-width:780px){.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}.mbar{display:flex!important}}

.lgo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none}
.side h2{font-size:clamp(30px,4.2cqw,50px);line-height:1.03;letter-spacing:-.04em;margin:24px 0 14px}

.btn.g{background:color-mix(in srgb,var(--s2) 80%,transparent);color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:var(--s2);transform:translateY(-1px)}
.btn.ld{pointer-events:none}.btn.ld>span{opacity:0}.btn.ld:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid rgba(10,14,19,.25);border-top-color:var(--acfg);animation:sp .7s linear infinite}

.btn:focus-visible,.fi input:focus-visible,select:focus-visible,.pl button:focus-visible,.tl:focus-visible,.link:focus-visible,.ob:focus-visible{outline:2px solid var(--at);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;position:relative}
.fi label{font-size:13.5px;color:var(--mu);font-weight:500}
.fi input,select{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:0 16px;min-height:54px;color:var(--tx);font:inherit;font-size:16px;width:100%;transition:border-color .2s,box-shadow .2s}
.fi input:focus{outline:none;border-color:var(--at);box-shadow:0 0 0 4px var(--glow)}
.fi.err input{border-color:var(--rd);animation:shk .35s}.fi .em{color:var(--rd);font-size:13px;min-height:0;display:none}.fi.err .em{display:block}

.eye{position:absolute;right:8px;top:36px;background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;font-size:13px;padding:10px;border-radius:12px}
.str{display:flex;gap:5px;margin-top:2px}.str i{flex:1;height:5px;border-radius:99px;background:var(--s2);transition:background .3s}
.sep{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:13px;margin:16px 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--bd)}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}

.pl button b{display:block;font-size:15px}.pl button span{font-family:var(--fm);font-size:13px;color:var(--mu)}
.pl button[aria-pressed="true"]{border-color:var(--at);background:var(--acsoft);box-shadow:0 0 0 3px var(--glow)}

.ck input{width:22px;height:22px;accent-color:var(--ac);flex:none;margin:0;border-radius:8px}
.ck a{color:var(--tx);text-decoration:underline}
.fine{font-size:13.5px;color:var(--mu);text-align:center;margin-top:16px}.fine a,.link{color:var(--at);text-decoration:none;font-weight:600;background:none;border:0;font:inherit;font-weight:600;cursor:pointer;padding:0}
.tl{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;margin-top:12px;width:100%;padding:10px;border-radius:14px}.tl:hover{color:var(--tx)}
.otp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0 16px}
.otp input{min-height:56px;padding:0;text-align:center;font-family:var(--fm);font-size:22px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);width:100%}
.otp input:focus{outline:none;border-color:var(--at);box-shadow:0 0 0 4px var(--glow)}
@container (max-width:460px){.otp{gap:4px}.otp input{min-height:50px;font-size:19px;border-radius:12px}}
.sum{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:9px}
.sum .r{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--mu)}.sum .r b{color:var(--tx);font-family:var(--fm);font-weight:500}
.sum .t{border-top:1px dashed var(--bd);padding-top:10px}.sum .t b{font-size:18px}
.lock{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mu);font-size:13px;margin-top:14px}
.fm{background:var(--bg);border:1px solid var(--bd);border-radius:16px;min-height:54px;display:flex;align-items:center;padding:0 16px;color:var(--mu);justify-content:space-between;margin-bottom:10px;font-family:var(--fm);font-size:15px}
.fmg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--s2),var(--bd),var(--s2));background-size:200% 100%;animation:skm 1.2s linear infinite;margin-bottom:10px}
@keyframes skm{to{background-position:-200% 0}}
.badge{font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:2px 9px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:7px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv b{font-weight:500;font-family:var(--fm);font-size:14px}
.opt{display:flex;gap:14px;align-items:center;border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;color:var(--tx);font:inherit;text-align:left;transition:all .25s}
.opt:hover{border-color:var(--at);transform:translateY(-1px)}.opt[aria-pressed="true"]{border-color:var(--at);background:var(--acsoft)}
.opt .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}.opt small{display:block;color:var(--mu);font-size:13px}
.hero{text-align:center}.lgbig{width:104px;height:104px;margin:6px auto 14px;display:block;overflow:visible}
.lgbig .lp{stroke:var(--at);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:lgp 2.2s .2s cubic-bezier(.6,0,.2,1) forwards;fill:none}
.lgbig .lr{fill:var(--bg);stroke:var(--at);stroke-width:2.4;opacity:0;animation:lgr .2s .5s forwards}
.lgbig .le{fill:var(--at);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:lge .5s 2.2s forwards}
@keyframes lgp{to{stroke-dashoffset:0}}@keyframes lgr{to{opacity:1}}@keyframes lge{60%{transform:scale(1.4)}to{transform:scale(1)}}
.staffrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 22px}
.sp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--bg);border-radius:99px;padding:8px 14px 8px 8px;font-size:14px;opacity:0;transform:scale(.8) translateY(8px);animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
.sp i{width:26px;height:26px;border-radius:9px;display:inline-block}
@keyframes pop{to{opacity:1;transform:none}}
.note{background:var(--acsoft);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--tx);margin-bottom:14px}
.back{background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer;padding:6px 8px;margin:-8px 0 8px -8px;border-radius:12px}.back:hover{color:var(--tx)}
.pass{height:5px}
@container (max-width:780px){.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}.mbar{display:flex}.main{padding:22px 16px 28px;justify-content:flex-start}.card{padding:22px 18px;border-radius:26px}}
@container (max-width:460px){.otp{gap:4px}.otp input{min-height:50px;font-size:19px;border-radius:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.chk li,.sp{opacity:1;transform:none}.lgbig .lp{stroke-dashoffset:0}.lgbig .lr{opacity:1}.lgbig .le{transform:none}}
</style>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var st={plan:'core',name:'',email:'',id:'',kind:'email',mode:'signup',screen:'signup',dev:'d'};
