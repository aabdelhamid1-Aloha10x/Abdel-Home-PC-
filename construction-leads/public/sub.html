<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get more jobs | Subcontractor network</title><link rel="stylesheet" href="/ui.css">
<style>.hero{padding:40px 0 20px}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1}.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}.pts div{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:14px}.tabs{margin:12px 0}.chk{display:flex;gap:6px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;margin:0;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--ink);font-size:13px}.chk input{width:auto}</style></head>
<body><div class="wrap" id="app"></div>
<script>
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = n => '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
const app = document.getElementById('app');
let T = localStorage.getItem('subtok') || '', me = null;
const TR = ['roofing','siding','gutters','concrete','bathroom','kitchen','interior','exterior','demolition','general','electrical','plumbing','hvac','commercial'];
async function api(m, p, b, raw) { const r = await fetch(p, { method: m, headers: { ...(raw ? {} : { 'Content-Type': 'application/json' }), 'x-sub-token': T }, body: raw || (b ? JSON.stringify(b) : undefined) }); const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.error || r.status); e.status = r.status; throw e; } return j; }

function landing(msg) {
  app.innerHTML = `<div class="hero"><p class="mute">NY &amp; NJ subcontractor network</p><h1>Stop chasing leads.<br>Bid on pre-measured, pre-funded jobs.</h1>
  <p class="mute" style="max-width:40em">We find the customer, price the job and collect the money. Every job comes with a scope, a phase plan and the customer's first payment already in. You bid, and the lowest eligible bid wins.</p>
  <div class="pts"><div><b>${M(me?.monthly_price ?? 55)}/mo</b><br><span class="mute">Flat subscription. No percentage of your job.</span></div><div><b>Small % per job</b><br><span class="mute">Withheld from each payout, never invoiced. You see it before you bid.</span></div><div><b>Paid per phase</b><br><span class="mute">The customer funds each phase before you start. No chasing money.</span></div><div><b>Pre-measured work</b><br><span class="mute">Scope and phase plan are done and phase 1 is already paid. Customer details unlock when you win.</span></div></div></div>
  <div class="row" style="align-items:start"><div class="card"><h3>Apply</h3><p class="err" id="e1"></p>
  <label>Company</label><input id="co"><label>Your name</label><input id="cn"><label>Email</label><input id="em" type="email"><label>Phone</label><input id="ph" type="tel"><label>Password (10+ characters)</label><input id="pw" type="password">
  <label>Trades</label><div class="chk" id="tr">${TR.map(t => `<label><input type="checkbox" value="${t}">${t}</label>`).join('')}</div>
  <label>States you work in</label><div class="chk" id="st"><label><input type="checkbox" value="NY">New York</label><label><input type="checkbox" value="NJ">New Jersey</label></div>
  <label>Narrow by ZIP prefixes (optional, comma-separated, e.g. 105,106,100)</label><input id="zp">
  <div class="row"><div><label>License / registration #</label><input id="ln"></div><div><label>License state</label><input id="ls" maxlength="2"></div></div>
  <label style="display:flex;gap:6px;color:var(--ink)"><input type="checkbox" id="ex" style="width:auto"> My trade/work does not require a license</label>
  <label>General liability insurance expires</label><input id="ie" type="date">
  <label style="display:flex;gap:6px;color:var(--ink)"><input type="checkbox" id="tm" style="width:auto"> I agree to the subcontractor terms: I hold the required licenses and insurance, I am an independent contractor, and the platform fee applies when I claim a job.</label>
  <br><button id="go" class="big">Apply</button></div>
  <div class="card"><h3>Sign in</h3><p class="err" id="e2">${E(msg || '')}</p><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><br><button id="li" class="big">Sign in</button></div></div>`;
  const chk = id => [...document.querySelectorAll('#' + id + ' input:checked')].map(i => i.value);
  document.getElementById('go').onclick = async () => { const g = i => document.getElementById(i).value; try { await api('POST', '/api/sub/signup', { company: g('co'), contact_name: g('cn'), email: g('em'), phone: g('ph'), password: g('pw'), trades: chk('tr'), states: chk('st'), zip_prefixes: g('zp'), license_number: g('ln'), license_state: g('ls'), license_exempt: document.getElementById('ex').checked, insurance_expires: g('ie'), accept_terms: document.getElementById('tm').checked }); app.innerHTML = '<div class="card narrow"><h2>Application received ✓</h2><p>We verify license and insurance, then approve your account (usually within 1 business day). Sign in any time to check your status and upload your certificate of insurance.</p><a class="btn" href="/sub.html">Sign in</a></div>'; } catch (e) { document.getElementById('e1').textContent = e.message; } };
  document.getElementById('li').onclick = async () => { try { T = (await api('POST', '/api/sub/login', { email: document.getElementById('le').value, password: document.getElementById('lp').value })).token; localStorage.setItem('subtok', T); portal(); } catch (e) { document.getElementById('e2').textContent = e.message; } };
}

async function portal(tab = 'board') {
  try { me = await api('GET', '/api/sub/me'); } catch { T = ''; localStorage.removeItem('subtok'); return landing('Please sign in.'); }
  const flag = me.status !== 'approved' ? `<div class="card"><b class="warn">Account ${E(me.status)}.</b> ${me.status === 'pending' ? 'We are verifying your license and insurance. Upload your certificate of insurance under Account to speed this up.' : 'Contact us.'}</div>` : me.subscription_status !== 'active' ? `<div class="card"><b class="warn">Subscription ${E(me.subscription_status)}.</b> Subscribe (${M(me.monthly_price)}/mo) to bid on jobs. <button id="sb" style="margin-left:8px">Subscribe</button></div>` : '';
  app.innerHTML = `<h2>${E(me.company)}</h2><nav><a href="#" data-t="board" class="${tab === 'board' ? 'on' : ''}">Live auctions</a><a href="#" data-t="bids" class="${tab === 'bids' ? 'on' : ''}">My bids</a><a href="#" data-t="mine" class="${tab === 'mine' ? 'on' : ''}">My jobs</a><a href="#" data-t="acct" class="${tab === 'acct' ? 'on' : ''}">Account</a><a href="#" id="out">Sign out</a></nav>${flag}<div id="pv"></div>`;
  document.querySelectorAll('nav [data-t]').forEach(a => a.onclick = e => { e.preventDefault(); portal(a.dataset.t); });
  document.getElementById('out').onclick = e => { e.preventDefault(); T = ''; localStorage.removeItem('subtok'); landing(); };
  const sb = document.getElementById('sb'); if (sb) sb.onclick = async () => { try { location.href = (await api('POST', '/api/sub/subscribe')).checkoutUrl; } catch (e) { alert(e.message); } };
  const pv = document.getElementById('pv');
  if (tab === 'board') {
    const jobs = await api('GET', '/api/sub/jobs');
    pv.innerHTML = jobs.length ? '' : '<div class="card mute">No live auctions match right now. New projects appear here when a customer approves a plan.</div>';
    const cards = [];
    jobs.forEach(j => { const d = document.createElement('div'); d.className = 'card';
      d.innerHTML = `<div class="row"><div><h3>${E(j.title)}</h3><span class="pill">${E(j.trades.join(', '))}</span> <span class="mute">area ${E(j.area)} · ${E(j.state)}</span><br><b class="warn" data-cd="${E(j.closes_at)}"></b></div>
      <div style="text-align:right;flex:0 0 auto"><span class="mute">Max bid</span><br><b style="font-size:22px">${M(j.ceiling)}</b><br>${j.sealed ? '<span class="mute">sealed bids</span>' : j.current_low != null ? `<span class="mute">best bid</span> <b>${M(j.current_low)}</b>` : '<span class="mute">no bids yet</span>'}<br><span class="mute">${j.bid_count} bidder${j.bid_count === 1 ? '' : 's'}</span></div></div>
      <p>${E(j.scope.summary)}</p><h4>Phases (customer funds each before it starts)</h4><table>${j.scope.phases.map(p => `<tr><td>${p.seq}. ${E(p.name)}</td><td>${p.days} day${p.days === 1 ? '' : 's'}</td><td>${p.share_pct}%</td></tr>`).join('')}</table>
      <details><summary>Scope &amp; measurements</summary><ul>${j.scope.items.map(i => `<li>${E(i.description)}${i.qty ? ' <span class="mute">(' + E(i.qty) + ' ' + E(i.unit) + ')</span>' : ''}</li>`).join('')}</ul>${j.scope.rooms.length ? '<p class="mute">Measured: ' + j.scope.rooms.map(r => `${E(r.name)} ${r.length}×${r.width}×${r.height} ft`).join('; ') + '</p>' : ''}${j.scope.preferences ? '<p class="mute">Customer wishes: ' + E(j.scope.preferences) + '</p>' : ''}</details>
      ${j.my_bid ? `<p>Your bid: <b>${M(j.my_bid.amount)}</b> in ${j.my_bid.days} days ${j.my_bid.leading ? '<span class="ok">· you are leading</span>' : '<span class="warn">· you have been outbid</span>'}</p>` : ''}
      ${j.eligible ? `<div class="row"><div><label>Your bid ($, must be ≤ ${M(j.min_next_bid)} and ≥ ${M(j.floor)})</label><input data-a type="number" step="0.01" placeholder="${j.min_next_bid}"></div><div><label>Working days</label><input data-d type="number" min="1" value="${j.my_bid ? j.my_bid.days : ''}"></div></div><label>Note to the customer (optional)</label><input data-n maxlength="500" placeholder="Licensed, insured, 15 yrs, schedule…"><p class="mute" data-net></p><p class="err" data-e></p><button class="big" data-b="${j.id}">Place bid</button><p class="mute">Bids are binding offers. You pay ${j.fee_pct}% of your price only if you win, withheld from your payouts. A bid in the last 15 minutes extends the clock.</p>` : '<p class="warn">Cannot bid: ' + E(j.reasons.join(' ')) + '</p>'}`;
      pv.appendChild(d); cards.push(d); });
    const cd = () => document.querySelectorAll('[data-cd]').forEach(el => { const ms = new Date(el.dataset.cd) - Date.now(); el.textContent = ms > 0 ? `Ends in ${Math.floor(ms / 3600000)}h ${Math.floor(ms / 60000) % 60}m ${Math.floor(ms / 1000) % 60}s` : 'Closing…'; });
    cd(); const iv = setInterval(() => { if (!document.body.contains(pv.firstChild || pv)) return clearInterval(iv); cd(); }, 1000);
    const poll = setInterval(() => { if (document.querySelector('nav a.on')?.dataset.t !== 'board' || document.activeElement?.tagName === 'INPUT') return; portal('board'); }, 20000); window.__poll && clearInterval(window.__poll); window.__poll = poll;
    pv.querySelectorAll('[data-a]').forEach(inp => inp.oninput = () => { const card = inp.closest('.card'), amt = +inp.value; const pct = jobs.find(x => x.id == card.querySelector('[data-b]').dataset.b).fee_pct; card.querySelector('[data-net]').textContent = amt > 0 ? `If you win at ${M(amt)}: fee ${M(amt * pct / 100)}, you keep ${M(amt * (1 - pct / 100))} before materials and labor.` : ''; });
    pv.querySelectorAll('[data-b]').forEach(b => b.onclick = async () => { const card = b.closest('.card'); card.querySelector('[data-e]').textContent = '';
      try { await api('POST', `/api/sub/jobs/${b.dataset.b}/bid`, { amount: card.querySelector('[data-a]').value, days: card.querySelector('[data-d]').value, note: card.querySelector('[data-n]').value }); portal('board'); } catch (e) { card.querySelector('[data-e]').textContent = e.message; } });
  } else if (tab === 'bids') {
    const bids = await api('GET', '/api/sub/my-bids');
    const label = { active: 'in the auction', won: 'WON: confirmed, customer details unlocked in My jobs', lost: 'not selected' };
    pv.innerHTML = bids.length ? '<div class="card"><table>' + bids.map(b => `<tr><td>${E(b.title)}</td><td>${M(b.amount)} · ${b.days} days</td><td>${E(label[b.status] || b.status)}</td></tr>`).join('') + '</table></div>' : '<div class="card mute">You have not placed any bids yet.</div>';
  } else if (tab === 'mine') {
    const mine = await api('GET', '/api/sub/my-jobs');
    pv.innerHTML = mine.length ? '' : '<div class="card mute">You have not claimed any jobs yet.</div>';
    mine.forEach(j => { const m = j.money, c = j.customer; const d = document.createElement('div'); d.className = 'card';
      d.innerHTML = `<h3>${E(j.title)} <span class="pill">${E(j.job_status)}</span></h3><p><b>${E(c.name)}</b> · ${E(c.phone)} · ${E(c.email)}<br>${E(c.address)} ${E(c.zip)}</p>
      <p class="${j.can_start ? 'ok' : 'warn'}">${j.can_start ? 'Cleared to start.' : 'Do NOT start yet: the customer has a legal right to cancel until ' + E(j.rescission_ends ? new Date(j.rescission_ends).toLocaleDateString() : 'the cancellation window closes') + ' and the deposit must be paid.'}</p>
      <table><tr><td>Award price</td><td>${M(j.payout)}</td></tr><tr><td>Platform fee (${j.fee_pct}%), withheld per payout</td><td>− ${M(j.fee)}</td></tr><tr><td><b>Your net</b></td><td><b>${M(m.your_net)}</b></td></tr></table>
      <h4>Phases</h4><table>${j.milestones.map(x => `<tr><td>${x.seq}. ${E(x.name)}<br><span class="mute">${x.funded ? '<span class="ok">customer funded ✓</span>' : 'waiting for customer funding'} · ${E(x.status)}${x.dispute_reason ? ' · <span class="warn">disputed: ' + E(x.dispute_reason) + '</span>' : ''}</span></td><td>${M(x.net)}<br><span class="mute">net of ${M(x.fee)} fee</span></td><td>${x.status === 'funded' && j.can_start ? `<button data-st="${x.id}">Start phase</button>` : x.status === 'in_progress' ? `<input type="file" accept="image/*" capture="environment" multiple data-ph="${x.id}"> <span class="mute">${x.photos} photo(s)</span><br><textarea data-nt="${x.id}" rows="2" placeholder="Notes for the customer"></textarea><label style="display:flex;gap:6px;color:var(--ink)"><input type="checkbox" data-wv="${x.id}" style="width:auto"> I waive lien rights for this phase's payment on receipt of it.</label><button data-sb="${x.id}">Submit completed work</button>` : ''}</td></tr>`).join('')}</table>
      <p class="mute">${E(m.how)}</p>
      <p>${E(j.scope.summary)}</p><ul>${j.scope.items.map(i => `<li>${E(i.description)} (${E(i.qty)} ${E(i.unit)})</li>`).join('')}</ul>`; pv.appendChild(d); });
    pv.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { const go = geo => api('POST', `/api/sub/milestones/${b.dataset.st}/start`, geo).then(() => portal('mine')).catch(e => alert(e.message)); navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => go({ lat: p.coords.latitude, lng: p.coords.longitude }), () => go({}), { timeout: 4000 }) : go({}); });
    pv.querySelectorAll('[data-ph]').forEach(i => i.onchange = async e => { for (const f of e.target.files) { try { await api('PUT', `/api/sub/milestones/${i.dataset.ph}/photo`, null, f); } catch (er) { alert(er.message); } } portal('mine'); });
    pv.querySelectorAll('[data-sb]').forEach(b => b.onclick = () => api('POST', `/api/sub/milestones/${b.dataset.sb}/submit`, { notes: pv.querySelector(`[data-nt="${b.dataset.sb}"]`).value, waiver: pv.querySelector(`[data-wv="${b.dataset.sb}"]`).checked }).then(() => portal('mine')).catch(e => alert(e.message)));
  } else {
    pv.innerHTML = `<div class="card"><h3>Account</h3><p>${E(me.email)} · ${E(me.phone)}<br>Trades: ${E(me.trades.join(', '))} · States: ${E(me.states.join(', '))} ${E(me.zip_prefixes.join(','))}<br>License: ${E(me.license)} ${E(me.license_state)}</p>
    <label>Insurance expires (keep current or you cannot claim jobs)</label><input type="date" id="ie" value="${E(me.insurance_expires)}"><br><button id="si" class="ghost">Update</button>
    <label>Certificate of insurance (PDF / JPG / PNG) ${me.has_coi ? '<span class="ok">on file ✓</span>' : '<span class="warn">not uploaded</span>'}</label><input type="file" id="cf" accept=".pdf,image/*"><br><br><button id="po" class="ghost">Set up bank payouts (Stripe)</button> <span class="mute">Required to receive phase payments.</span></div>`;
    document.getElementById('po').onclick = async () => { try { location.href = (await api('POST', '/api/sub/payouts/setup')).url; } catch (e) { alert(e.message); } };
    document.getElementById('si').onclick = async () => { try { await api('PUT', '/api/sub/profile', { insurance_expires: document.getElementById('ie').value }); portal('acct'); } catch (e) { alert(e.message); } };
    document.getElementById('cf').onchange = async e => { try { await api('PUT', '/api/sub/coi', null, e.target.files[0]); portal('acct'); } catch (er) { alert(er.message); } };
  }
}
T ? portal() : landing();
</script></body></html>
